<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闲鱼 Agent 管理后台</title>
<style>
:root{
  --bg:#0f1216;
  --bg-2:#151a21;
  --panel:#1a2029;
  --panel-2:#212936;
  --border:#2a3341;
  --text:#e6edf6;
  --muted:#8b98a9;
  --accent:#4c9aff;
  --accent-hi:#5ea8ff;
  --green:#2ecc71;
  --red:#ff5c5c;
  --grey:#7a8899;
  --yellow:#f5b942;
  --radius:10px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px;line-height:1.5;
}
a{color:var(--accent);text-decoration:none}

/* ---------- layout ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:200px;flex:0 0 200px;background:var(--bg-2);border-right:1px solid var(--border);
  padding:16px 12px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{font-size:15px;font-weight:700;letter-spacing:.4px;color:#fff;padding:6px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:0}
.nav-item{padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer;user-select:none;font-size:14px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel-2);color:#fff;border-color:var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 22px;background:rgba(21,26,33,.9);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);
}
.spacer{flex:1}
.tb-item{font-size:13px;color:var(--muted);white-space:nowrap}
.tb-item b{color:var(--text);font-weight:600}
.content{padding:22px;max-width:1500px;width:100%;flex:1;min-width:0}

/* ---------- atoms ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;border:1px solid var(--border);background:var(--panel);color:var(--grey);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.pill.green{color:var(--green);border-color:rgba(46,204,113,.35);background:rgba(46,204,113,.08)}
.pill.grey{color:var(--grey)}
.pill.red{color:var(--red);border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.08)}

.btn{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,opacity .15s;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-hi)}
.btn.danger{color:#ffb4b4;border-color:#5a2b2b}
.btn.danger:hover:not(:disabled){background:#3a1e1e;border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}

.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:19px;font-weight:600}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:600}
.sec-title{color:var(--accent);font-size:13px;letter-spacing:.5px;text-transform:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card .k{font-size:12px;color:var(--muted);margin-bottom:8px}
.card .v{font-size:20px;font-weight:600;word-break:break-word}

.warn{background:rgba(245,185,66,.07);border:1px solid rgba(245,185,66,.35);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.warn-title{color:var(--yellow);font-weight:600;margin-bottom:6px;font-size:13px}
.warn ul{margin:0;padding-left:20px;color:#e8d6a8;font-size:13px}
.errbox{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;color:#ffc9c9;font-size:13px;word-break:break-word}
.errbox b{color:#ff9c9c}

.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(245,185,66,.15);color:var(--yellow);border:1px solid rgba(245,185,66,.4);margin-left:6px;vertical-align:middle}
.badge.off{background:rgba(122,136,153,.15);color:var(--muted);border-color:var(--border)}

/* ---------- forms ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea{
  width:100%;background:#0d1116;border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;
  transition:border-color .15s;
}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--accent)}
input[readonly]{opacity:.7;cursor:not-allowed}
textarea{resize:vertical;font-family:ui-monospace,Consolas,"Courier New",monospace;line-height:1.55}
.field.bool{flex-direction:row;align-items:center;justify-content:space-between;background:#0d1116;border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.field.bool>label{font-size:13px;color:var(--text);cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.prompt-area{min-height:56vh;line-height:1.6}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}

/* ---------- tools ---------- */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tool{background:#0f141a;border:1px solid var(--border);border-radius:10px;padding:12px}
.tool-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.tool-h .tname{font-weight:600;font-size:13px}
.tool .muted{font-size:12px}

/* ---------- sessions ---------- */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.scrollbox{max-height:72vh;overflow:auto}
.sess-item{padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#0f141a;transition:border-color .15s,background .15s}
.sess-item:hover{border-color:var(--accent)}
.sess-item.active{border-color:var(--accent);background:rgba(76,154,255,.08)}
.sess-h{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.sess-h .nick{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.sess-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.sess-item .muted{font-size:12px}
.sess-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap}
.sess-detail-head .muted{font-size:12px;word-break:break-all}
.chat{display:flex;flex-direction:column}
.bubble{max-width:80%;padding:9px 12px;border-radius:12px;margin:8px 0;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bubble.user{margin-left:auto;background:#1d3a5c;border:1px solid #285080}
.bubble.assistant{background:var(--panel-2);border:1px solid var(--border)}
.bubble .who{font-size:11px;color:var(--muted);margin-bottom:4px}
.bubble .ts{display:block;font-size:11px;color:var(--muted);margin-top:6px}

/* ---------- logs ---------- */
.log-pre{
  background:#0b0e12;border:1px solid var(--border);border-radius:8px;padding:12px;
  font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;line-height:1.55;
  max-height:62vh;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:10px 0 0;color:#c9d6e4;
}
.log-pre mark{background:#4a3a00;color:#ffd97a;border-radius:3px;padding:0 2px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{
  background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);
  padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:tin .18s ease;word-break:break-word;
}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(6,9,12,.72);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:380px;max-width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px}
.modal-body{padding:18px;text-align:center}
.qr-imgwrap{background:#fff;border-radius:10px;padding:10px;display:inline-flex;align-items:center;justify-content:center;margin:12px 0;min-width:200px;min-height:200px}
.qr-imgwrap img{display:block;width:180px;height:180px;object-fit:contain}
.qr-status{font-size:13px;font-weight:600}
.qr-msg{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px;word-break:break-word}

/* ---------- switch ---------- */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch span{color:var(--text)}

@media (max-width:1100px){
  .sidebar{width:170px;flex:0 0 170px}
  .split{grid-template-columns:290px 1fr}
  .content{padding:16px}
}
@media (max-width:820px){
  .split{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">闲鱼 Agent<small>管理后台</small></div>
    <div class="nav-item" data-page="overview">总览</div>
    <div class="nav-item" data-page="config">基础配置</div>
    <div class="nav-item" data-page="prompt">系统提示词</div>
    <div class="nav-item" data-page="skills">技能库</div>
    <div class="nav-item" data-page="sessions">会话记录</div>
    <div class="nav-item" data-page="logs">运行日志</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="pill grey" id="bot-pill"><span class="dot"></span>未知</span>
      <span class="tb-item">账号：<b id="top-account">—</b></span>
      <span class="tb-item" id="top-uptime">运行时长 —</span>
      <span class="tb-item" id="top-version"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="btn-start">启动</button>
      <button class="btn" id="btn-stop">停止</button>
      <button class="btn" id="btn-restart">重启</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 扫码登录弹窗 -->
<div class="modal-backdrop" id="qr-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>扫码登录闲鱼</h3>
      <button class="btn sm ghost" id="qr-close" type="button">关闭</button>
    </div>
    <div class="modal-body">
      <div class="qr-status" id="qr-status">正在获取二维码…</div>
      <div class="qr-imgwrap"><img id="qr-img" alt="登录二维码"></div>
      <div class="qr-msg" id="qr-msg"></div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn sm" id="qr-refresh" type="button">刷新二维码</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================ 工具函数 ============================ */

function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

/** 转义服务端字符串，插入 HTML 前必须调用 */
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getPath(obj, path){
  return path.split('.').reduce(function(o,k){ return (o === null || o === undefined) ? undefined : o[k]; }, obj);
}
function setPath(obj, path, val){
  var parts = path.split('.');
  var cur = obj;
  for (var i = 0; i < parts.length - 1; i++){
    if (typeof cur[parts[i]] !== 'object' || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function deepClone(o){
  try { return JSON.parse(JSON.stringify(o)); } catch(e){ return {}; }
}

function fmtUptime(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  var d = Math.floor(sec / 86400);
  var h = Math.floor((sec % 86400) / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  if (d > 0) return d + ' 天 ' + h + ' 小时';
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  if (m > 0) return m + ' 分 ' + s + ' 秒';
  return s + ' 秒';
}
function fmtSize(n){
  n = Number(n);
  if (!isFinite(n) || n < 0) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

/* ============================ toast ============================ */

var toastBox = document.getElementById('toasts');
function toast(msg, type){
  if (!toastBox) return;
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? 'ok' : (type === 'err' ? 'err' : ''));
  el.textContent = (msg === null || msg === undefined || msg === '') ? '操作完成' : String(msg);
  toastBox.appendChild(el);
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }, 3200);
  while (toastBox.children.length > 6) toastBox.removeChild(toastBox.firstChild);
}

/* ============================ API ============================ */

async function api(method, path, body){
  var opts = { method: method, headers: {}, cache: 'no-store' };
  if (body !== undefined){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  var res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    throw new Error('网络请求失败：' + (e && e.message ? e.message : '未知错误'));
  }
  var data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok){
    var m = (data && data.message) ? data.message : ('请求失败（HTTP ' + res.status + '）');
    throw new Error(m);
  }
  if (data && data.ok === false) throw new Error(data.message || '操作失败');
  return data;
}

/** 统一处理：成功 toast 可选，失败 toast 并返回 null */
async function call(method, path, body, okMsg){
  try {
    var data = await api(method, path, body);
    if (okMsg) toast(okMsg, 'ok');
    return data;
  } catch (e) {
    toast(e && e.message ? e.message : '请求失败', 'err');
    return null;
  }
}

/** 请求期间禁用按钮 */
async function busy(btn, fn){
  if (!btn) return fn();
  if (btn.disabled) return null;
  btn.disabled = true;
  try { return await fn(); }
  finally { btn.disabled = false; }
}

/* ============================ 全局状态 ============================ */

var state = {
  page: 'overview',
  status: null,
  config: null,
  configProblems: [],
  prompt: null,
  skills: [],
  sessions: [],
  currentSession: null,
  logs: [],
  logFilter: '',
  logAuto: true,
  tools: [],
  botBusy: false
};

var content = document.getElementById('content');
var logsTimer = null;
var statusTimer = null;

function clearLogsTimer(){
  if (logsTimer){ clearInterval(logsTimer); logsTimer = null; }
}

/* ============================ 顶栏 / 状态 ============================ */

function renderTopbar(){
  var st = state.status;
  var pill = document.getElementById('bot-pill');
  if (pill){
    var cls = 'pill grey', txt = '未知';
    if (st){
      if (st.running){ cls = 'pill green'; txt = '运行中'; }
      else if (st.last_error){ cls = 'pill red'; txt = '异常'; }
      else { cls = 'pill grey'; txt = '已停止'; }
    }
    pill.className = cls;
    pill.innerHTML = '<span class="dot"></span>' + esc(txt);
  }
  var acc = document.getElementById('top-account');
  if (acc) acc.textContent = (st && st.account) ? st.account : '未登录';
  var up = document.getElementById('top-uptime');
  if (up) up.textContent = st ? ('运行时长 ' + fmtUptime(st.uptime_sec)) : '运行时长 —';
  var ver = document.getElementById('top-version');
  if (ver) ver.textContent = (st && st.version) ? ('版本 ' + st.version) : '';
  applyBotButtonState();
}

async function refreshStatus(silent){
  try {
    var st = await api('GET', '/api/status');
    state.status = st;
    renderTopbar();
    if (state.page === 'overview') updateOverviewStatus();
    return st;
  } catch (e) {
    if (!silent) toast('获取状态失败：' + e.message, 'err');
    return null;
  }
}

async function botAction(action, btn){
  var st = state.status || {};
  // 防呆：状态已知时，不该点的按钮直接拦掉，省一次无效请求
  if (action === 'start' && st.running){ toast('机器人已经在运行中了', 'warn'); return; }
  if (action === 'stop' && !st.running){ toast('机器人本来就没在运行', 'warn'); return; }

  if (action === 'stop' && !confirm('确定要停止机器人吗？停止后店铺将不再自动回复买家。')) return;
  if (action === 'restart' && st.running && !confirm('确定要重启机器人吗？会有几秒钟无法回复。')) return;

  return busy(btn, async function(){
    state.botBusy = true;
    try {
      return await runBotAction(action, st);
    } finally {
      state.botBusy = false;
      applyBotButtonState();
    }
  });
}

async function runBotAction(action, st){
  var d = await call('POST', '/api/bot/' + action);

  if (!d || d.ok === false){
    // 失败时不要乐观地把界面刷成"已启动"，把真实原因显示出来
    await refreshStatus(true);
    toast((d && d.message) || '操作失败', 'err');
    return;
  }

  // 启动/停止是异步生效的（要连 WebSocket / 等协程退出），轮询确认最终状态
  var want = action === 'stop' ? false : true;
  var confirmed = false;
  for (var i = 0; i < 12; i++){
    await new Promise(function(r){ setTimeout(r, 500); });
    var s = await refreshStatus(true);
    if (!s) continue;
    if (!!s.running === want){ confirmed = true; break; }
    if (want && s.last_error) break;   // 启动失败会写 last_error，不用再等
  }

  var s2 = state.status || {};
  if (confirmed){
    toast(d.message || '操作成功', 'ok');
  } else if (want && s2.last_error){
    toast('启动失败：' + s2.last_error, 'err');
  } else {
    toast(want ? '已发出启动指令，但暂未确认连上，请看日志'
               : '已发出停止指令，但暂未确认停止，请看日志', 'warn');
  }
  await refreshStatus(true);
}

/** 按运行状态设置所有启停按钮的可用性（防呆的核心） */
function applyBotButtonState(){
  var st = state.status;
  if (!st) return;
  var running = !!st.running;
  var locked = !!state.botBusy;   // 操作进行中时全部锁住，避免重复点击
  var set = function(id, enabled, title){
    var b = document.getElementById(id);
    if (!b) return;
    b.disabled = locked || !enabled;
    b.title = title || '';
    b.setAttribute('aria-disabled', (locked || !enabled) ? 'true' : 'false');
  };
  set('btn-start',   !running, running ? '已在运行中' : '');
  set('btn-stop',     running, running ? '' : '当前未运行');
  set('btn-restart',  running, running ? '' : '先启动才能重启');
  set('ov-start',    !running, running ? '已在运行中' : '');
  set('ov-stop',      running, running ? '' : '当前未运行');
  set('ov-restart',   running, running ? '' : '先启动才能重启');
}

/* ============================ 扫码登录 ============================ */

var qrTimer = null;
var qrErrCount = 0;

function stopQrPoll(){
  if (qrTimer){ clearInterval(qrTimer); qrTimer = null; }
}

function closeQrModal(){
  stopQrPoll();
  var m = document.getElementById('qr-modal');
  if (m) m.hidden = true;
}

async function openQrModal(){
  var modal = document.getElementById('qr-modal');
  if (modal) modal.hidden = false;
  var img = document.getElementById('qr-img');
  if (img) img.removeAttribute('src');
  var st = document.getElementById('qr-status');
  if (st) st.textContent = '正在获取二维码…';
  var msg = document.getElementById('qr-msg');
  if (msg) msg.textContent = '';

  var d = await call('POST', '/api/login/qr');
  if (!d){
    if (st) st.textContent = '二维码获取失败';
    return;
  }
  if (d.qr_png_base64 && img) img.src = 'data:image/png;base64,' + d.qr_png_base64;
  if (st) st.textContent = '请使用闲鱼 App 扫码';
  if (msg) msg.textContent = d.message || '';
  qrErrCount = 0;
  stopQrPoll();
  qrTimer = setInterval(pollQr, 2000);
}

var QR_TEXT = {
  idle: '等待中…',
  waiting: '等待扫码…',
  scanned: '已扫码，请在手机上确认',
  confirmed: '已确认，正在登录…',
  success: '登录成功',
  failed: '登录失败'
};

async function pollQr(){
  var d;
  try {
    d = await api('GET', '/api/login/qr');
    qrErrCount = 0;
  } catch (e) {
    qrErrCount++;
    var m0 = document.getElementById('qr-msg');
    if (m0) m0.textContent = e.message;
    if (qrErrCount >= 5){ stopQrPoll(); toast('二维码状态查询失败：' + e.message, 'err'); }
    return;
  }
  var status = d.status || 'idle';
  var stEl = document.getElementById('qr-status');
  var msgEl = document.getElementById('qr-msg');
  if (stEl) stEl.textContent = QR_TEXT[status] || status;
  if (msgEl) msgEl.textContent = d.message || '';

  if (status === 'success'){
    stopQrPoll();
    toast('登录成功' + (d.account ? '：' + d.account : ''), 'ok');
    await refreshStatus(true);
    try {
      var c = await api('GET', '/api/config');
      if (c && c.config){
        state.config = c.config;
        state.configProblems = c.problems || [];
        if (state.page === 'config'){ renderProblems(); buildConfigForm(); }
      }
    } catch (e) { /* 配置刷新失败不阻断流程 */ }
    if (stEl) stEl.textContent = '登录成功';
    setTimeout(closeQrModal, 1200);
  } else if (status === 'failed'){
    stopQrPoll();
    toast('登录失败：' + (d.message || '未知原因'), 'err');
  }
}

function buildConfigForm(){
  var root = document.getElementById('cfg-form');
  if (!root) return;
  cfgFields = [];
  var html = '';
  CONFIG_SPEC.forEach(function(sec){
    html += '<div class="panel"><h3 class="sec-title">' + esc(sec.title) + '</h3><div class="grid">';
    sec.fields.forEach(function(f){
      var val = getPath(state.config, f.path);
      var id = 'cfg_' + f.path.replace(/\./g, '__');
      if (f.type === 'bool'){
        html += '<div class="field bool"><label for="' + id + '">' + esc(f.label) + '</label>' +
                '<input type="checkbox" id="' + id + '"' + (val ? ' checked' : '') + '></div>';
        return;
      }
      html += '<div class="field' + (f.full ? ' full' : '') + '">';
      html += '<label for="' + id + '">' + esc(f.label) + '</label>';
      if (f.type === 'textarea'){
        html += '<textarea id="' + id + '" rows="' + (f.rows || 3) + '" spellcheck="false">' +
                esc(val === null || val === undefined ? '' : val) + '</textarea>';
      } else if (f.type === 'int' || f.type === 'float'){
        html += '<input type="number" id="' + id + '" step="' + (f.type === 'float' ? '0.1' : '1') +
                '" value="' + esc(val === null || val === undefined ? '' : val) + '">';
      } else {
        html += '<input type="text" id="' + id + '" spellcheck="false" value="' +
                esc(val === null || val === undefined ? '' : val) + '">';
      }
      if (f.qr) html += '<div class="row"><button class="btn ghost" type="button" id="cfg-qr">扫码登录</button></div>';
      if (f.hint) html += '<div class="hint">' + esc(f.hint) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  root.innerHTML = html;

  CONFIG_SPEC.forEach(function(sec){
    sec.fields.forEach(function(f){
      var el = document.getElementById('cfg_' + f.path.replace(/\./g, '__'));
      if (el) cfgFields.push({ path: f.path, type: f.type, el: el });
    });
  });
  var qr = document.getElementById('cfg-qr');
  if (qr) qr.onclick = function(){ openQrModal(); };
}

async function saveConfig(){
  if (!state.config){ await loadConfigForm(); if (!state.config) return; }
  var copy = deepClone(state.config);
  var bad = null;
  cfgFields.forEach(function(f){
    var v;
    if (f.type === 'bool'){
      v = !!f.el.checked;
    } else if (f.type === 'int'){
      v = parseInt(f.el.value, 10);
      if (isNaN(v)){ v = getPath(copy, f.path); if (bad === null) bad = f.path; }
    } else if (f.type === 'float'){
      v = parseFloat(f.el.value);
      if (isNaN(v)){ v = getPath(copy, f.path); if (bad === null) bad = f.path; }
    } else {
      v = f.el.value;
    }
    setPath(copy, f.path, v);
  });
  if (bad){ toast('有数字字段填写了无效内容，已保留原值：' + bad, 'err'); }

  var d = await call('PUT', '/api/config', { config: copy });
  if (!d) return;
  state.config = copy;
  state.configProblems = d.problems || [];
  toast(d.message || '配置已保存', 'ok');
  renderProblems();
  buildConfigForm();
}

async function saveSkill(){
  var nameEl = document.getElementById('sk-name');
  var descEl = document.getElementById('sk-desc');
  var textEl = document.getElementById('sk-content');
  if (!nameEl || !textEl) return;
  var name = (nameEl.value || '').trim();
  var desc = descEl ? (descEl.value || '').trim() : '';
  var text = textEl.value;
  if (!name){ toast('请填写技能名称', 'err'); return; }
  if (!/^[A-Za-z0-9_.\-\u4e00-\u9fa5]+$/.test(name)){
    toast('名称只能包含中文、字母、数字、下划线、短横线或点', 'err');
    return;
  }
  var body = { content: text };
  if (desc) body.description = desc;
  var d = await call('PUT', '/api/skills/' + encodeURIComponent(name), body);
  if (!d) return;
  toast(d.message || '技能已保存', 'ok');
  var box = document.getElementById('sk-editor');
  if (box) box.innerHTML = '';
  await loadSkills();
}

/* ============================ 会话记录 ============================ */

function renderSessions(){
  content.innerHTML =
    '<div class="page-head"><h2>会话记录</h2><button class="btn" id="ss-refresh">刷新</button></div>' +
    '<div class="split">' +
      '<div class="panel scrollbox"><h3>会话列表</h3><div id="ss-list">加载中…</div></div>' +
      '<div class="panel scrollbox"><h3>消息详情</h3><div id="ss-detail">' +
        '<div class="muted">请选择左侧会话查看消息。</div></div>' +
      '</div>' +
    '</div>';

  document.getElementById('ss-refresh').onclick = function(e){
    return busy(e.currentTarget, async function(){
      state.currentSession = null;
      await loadSessions();
      var det = document.getElementById('ss-detail');
      if (det) det.innerHTML = '<div class="muted">请选择左侧会话查看消息。</div>';
      toast('已刷新', 'ok');
    });
  };
  loadSessions();
}

async function loadSessions(){
  var box = document.getElementById('ss-list');
  if (!box) return;
  var d = await call('GET', '/api/sessions?limit=30');
  if (!d){ box.innerHTML = '<div class="muted">加载失败。</div>'; return; }
  state.sessions = d.sessions || [];
  if (!state.sessions.length){
    box.innerHTML = '<div class="muted">暂无会话。</div>';
    return;
  }
  var curId = state.currentSession ? state.currentSession.chat_id : null;
  box.innerHTML = state.sessions.map(function(s, i){
    var active = (curId && s.chat_id === curId) ? ' active' : '';
    var title = s.nickname || s.user_id || s.chat_id;
    return '<div class="sess-item' + active + '" data-i="' + i + '">' +
      '<div class="sess-h"><span class="nick">' + esc(title) + '</span>' +
        (s.manual_mode ? '<span class="badge">人工</span>' : '') +
        '<span class="badge off">' + esc(s.message_count === null || s.message_count === undefined ? 0 : s.message_count) + '</span>' +
      '</div>' +
      '<div class="muted truncate">' + esc(s.last_message || '') + '</div>' +
      '<div class="sess-f"><span class="muted">' + esc(s.last_time || '') + '</span>' +
        '<button class="btn sm" data-manual="' + i + '">' + (s.manual_mode ? '恢复AI' : '接管') + '</button>' +
      '</div>' +
    '</div>';
  }).join('');

  $$('#ss-list .sess-item').forEach(function(el){
    el.onclick = function(){ openSession(state.sessions[Number(el.dataset.i)]); };
  });
  $$('#ss-list [data-manual]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var s = state.sessions[Number(b.dataset.manual)];
      return busy(b, function(){ return toggleManual(s); });
    };
  });
}

function bubbleHtml(m){
  var isAssistant = (m.role === 'assistant');
  var role = isAssistant ? 'assistant' : 'user';
  var who = isAssistant ? 'AI' : '用户';
  return '<div class="bubble ' + role + '">' +
    '<div class="who">' + who + '</div>' +
    esc(m.content || '') +
    '<span class="ts">' + esc(m.timestamp || '') + '</span>' +
  '</div>';
}

async function openSession(s){
  if (!s) return;
  state.currentSession = s;
  $$('#ss-list .sess-item').forEach(function(el){ el.classList.remove('active'); });
  var items = $$('#ss-list .sess-item');
  for (var i = 0; i < items.length; i++){
    var idx = Number(items[i].dataset.i);
    if (state.sessions[idx] && state.sessions[idx].chat_id === s.chat_id) items[i].classList.add('active');
  }
  var det = document.getElementById('ss-detail');
  if (!det) return;
  det.innerHTML = '<div class="muted">加载中…</div>';
  var d = await call('GET', '/api/sessions/' + encodeURIComponent(s.chat_id));
  if (!d){ det.innerHTML = '<div class="muted">加载失败。</div>'; return; }
  var msgs = d.messages || [];
  var title = s.nickname || s.user_id || s.chat_id;
  det.innerHTML =
    '<div class="sess-detail-head">' +
      '<div><b>' + esc(title) + '</b>' +
        '<div class="muted">chat_id：' + esc(s.chat_id) +
          (s.item_id ? (' · item_id：' + esc(s.item_id)) : '') + '</div></div>' +
      '<button class="btn ' + (s.manual_mode ? '' : 'primary') + '" id="sd-manual">' +
        (s.manual_mode ? '恢复AI回复' : '人工接管') + '</button>' +
    '</div>' +
    '<div class="chat">' +
      (msgs.length ? msgs.map(bubbleHtml).join('') : '<div class="muted">暂无消息。</div>') +
    '</div>';
  var btn = document.getElementById('sd-manual');
  if (btn) btn.onclick = function(e){ return busy(e.currentTarget, function(){ return toggleManual(s); }); };
}

async function toggleManual(s){
  if (!s) return;
  var next = !s.manual_mode;
  var d = await call('POST', '/api/sessions/' + encodeURIComponent(s.chat_id) + '/manual', { manual: next });
  if (!d) return;
  toast(d.message || (next ? '已人工接管' : '已恢复 AI 回复'), 'ok');
  if (state.page !== 'sessions') return;
  var keepId = state.currentSession ? state.currentSession.chat_id : null;
  await loadSessions();
  if (keepId){
    var found = null;
    for (var i = 0; i < state.sessions.length; i++){
      if (state.sessions[i].chat_id === keepId){ found = state.sessions[i]; break; }
    }
    if (found) await openSession(found);
    else {
      state.currentSession = null;
      var det = document.getElementById('ss-detail');
      if (det) det.innerHTML = '<div class="muted">请选择左侧会话查看消息。</div>';
    }
  }
}

/* ============================ 运行日志 ============================ */

function renderLogs(){
  content.innerHTML =
    '<div class="page-head"><h2>运行日志</h2><div class="row">' +
      '<label class="switch"><input type="checkbox" id="log-auto"' + (state.logAuto ? ' checked' : '') + '><span>自动刷新</span></label>' +
      '<button class="btn" id="log-refresh">刷新</button>' +
    '</div></div>' +
    '<div class="panel">' +
      '<div class="row">' +
        '<input type="text" id="log-filter" spellcheck="false" style="max-width:420px" ' +
          'placeholder="筛选包含指定文本的日志行…" value="' + esc(state.logFilter) + '">' +
        '<span class="muted" id="log-info"></span>' +
      '</div>' +
      '<pre class="log-pre" id="log-pre">加载中…</pre>' +
    '</div>';

  var autoEl = document.getElementById('log-auto');
  autoEl.onchange = function(){ state.logAuto = !!autoEl.checked; };

  document.getElementById('log-refresh').onclick = function(e){
    return busy(e.currentTarget, function(){ return loadLogs(false); });
  };
  var f = document.getElementById('log-filter');
  f.oninput = function(){ state.logFilter = f.value; renderLogLines(); };

  loadLogs(true);
  clearLogsTimer();
  logsTimer = setInterval(function(){
    if (state.logAuto && state.page === 'logs') loadLogs(true);
  }, 3000);
}

async function loadLogs(silent){
  try {
    var d = await api('GET', '/api/logs?lines=500');
    state.logs = d.lines || [];
    renderLogLines();
  } catch (e) {
    if (!silent){
      toast('日志加载失败：' + e.message, 'err');
      var pre = document.getElementById('log-pre');
      if (pre) pre.textContent = '日志加载失败：' + e.message;
    }
  }
}

function highlightLine(line, q){
  var eLine = esc(line);
  if (!q) return eLine;
  var eQ = esc(q);
  var lower = eLine.toLowerCase();
  var lq = eQ.toLowerCase();
  var out = '';
  var i = 0;
  while (true){
    var idx = lower.indexOf(lq, i);
    if (idx < 0){ out += eLine.slice(i); break; }
    out += eLine.slice(i, idx) + '<mark>' + eLine.slice(idx, idx + eQ.length) + '</mark>';
    i = idx + eQ.length;
  }
  return out;
}

function renderLogLines(){
  var pre = document.getElementById('log-pre');
  if (!pre) return;
  var q = (state.logFilter || '').trim();
  var lines = state.logs || [];
  var shown = lines;
  if (q){
    var lq = q.toLowerCase();
    shown = lines.filter(function(l){ return String(l).toLowerCase().indexOf(lq) >= 0; });
  }
  var info = document.getElementById('log-info');
  if (info) info.textContent = '共 ' + lines.length + ' 行' + (q ? ('，匹配 ' + shown.length + ' 行') : '');

  var atBottom = (pre.scrollTop + pre.clientHeight) >= (pre.scrollHeight - 40);
  if (!shown.length){
    pre.textContent = q ? '没有匹配的日志行。' : '暂无日志。';
    return;
  }
  pre.innerHTML = shown.map(function(l){ return highlightLine(String(l), q); }).join('\n');
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

/* ============================ 页面切换 ============================ */

var PAGES = {
  overview: renderOverview,
  config: renderConfig,
  prompt: renderPrompt,
  skills: renderSkills,
  sessions: renderSessions,
  logs: renderLogs
};

function nav(page){
  if (!PAGES[page]) page = 'overview';
  state.page = page;
  clearLogsTimer();
  $$('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.page === page); });
  content.innerHTML = '';
  try {
    PAGES[page]();
  } catch (e) {
    content.innerHTML = '<div class="errbox">页面渲染失败：' + esc(e && e.message ? e.message : '未知错误') + '</div>';
  }
  if (window.scrollTo) window.scrollTo(0, 0);
}

/* ============================ 初始化 ============================ */

function init(){
  $$('.nav-item').forEach(function(el){
    el.onclick = function(){ nav(el.dataset.page); };
  });

  document.getElementById('btn-start').onclick = function(e){ return botAction('start', e.currentTarget); };
  document.getElementById('btn-stop').onclick = function(e){ return botAction('stop', e.currentTarget); };
  document.getElementById('btn-restart').onclick = function(e){ return botAction('restart', e.currentTarget); };

  var qrClose = document.getElementById('qr-close');
  if (qrClose) qrClose.onclick = function(){ closeQrModal(); };
  var qrRefresh = document.getElementById('qr-refresh');
  if (qrRefresh) qrRefresh.onclick = function(e){
    return busy(e.currentTarget, async function(){ await openQrModal(); });
  };
  var backdrop = document.getElementById('qr-modal');
  if (backdrop){
    backdrop.addEventListener('click', function(ev){
      if (ev.target === backdrop) closeQrModal();
    });
  }
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') closeQrModal();
  });

  nav('overview');
  refreshStatus(true);
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = setInterval(function(){ refreshStatus(true); }, 5000);
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
